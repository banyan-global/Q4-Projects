<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16294a">
<title>تقويم المدير العام · بنيان العالمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ceotheme")==="dark"?"dark":"light")}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
[hidden]{display:none!important}
/* هوية بنيان: كحلي + ذهبي — مطابقة لموقع مهام الربع الرابع */
:root{
  color-scheme:dark;
  --bg-0:#162942; --bg-1:#0f1f38; --panel:#21385a; --panel-2:#1b3050;
  --line:rgba(216,183,106,.30); --line-soft:rgba(255,255,255,.10); --tint:rgba(255,255,255,.05); --tint-gold:rgba(216,183,106,.10);
  --gold:#e3c485; --gold-2:#f3dca6; --navy:#0f1f38; --sel-bg:linear-gradient(135deg,#f3dca6,#e3c485); --sel-fg:#16294a;
  --cyan:#5fd9e6; --violet:#a99bff; --rose:#ff8893; --green:#5fe0a0; --amber:#ffd27a; --muted:#8ba0bb; --pink:#f29be0;
  --txt:#f4f8fd; --txt-2:#c3d2e4; --txt-3:#8ba0bb;
  --shadow:0 24px 60px rgba(8,18,35,.55); --pop:0 26px 60px rgba(0,0,0,.45); --radius:22px;
  --font:"Tajawal","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-0:#eef2f8; --bg-1:#e4eaf3; --panel:#ffffff; --panel-2:#f8fafc;
  --line:rgba(201,168,106,.50); --line-soft:rgba(22,41,74,.12); --tint:rgba(22,41,74,.04); --tint-gold:rgba(201,168,106,.14);
  --gold:#b5923f; --gold-2:#8a6c2e; --navy:#16294a; --sel-bg:#16294a; --sel-fg:#f3dca6;
  --cyan:#0b7886; --violet:#5b4bc4; --rose:#a32232; --green:#146c3c; --amber:#8a5f00; --muted:#5f7286; --pink:#a0368f;
  --txt:#15233c; --txt-2:#3c4f66; --txt-3:#5f7286;
  --shadow:0 14px 34px rgba(22,41,74,.10); --pop:0 24px 54px rgba(22,41,74,.20);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg-0);color:var(--txt);line-height:1.6;font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60% 50% at 80% 0%,rgba(227,196,133,.14),transparent 60%),
  radial-gradient(55% 45% at 10% 12%,rgba(95,217,230,.07),transparent 60%),
  linear-gradient(180deg,var(--bg-0),var(--bg-1))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 90px}

/* ===== الهيرو ===== */
.hero{position:relative;text-align:center;background:#16294a;border-top:5px solid #c9a86a;border-radius:0 0 26px 26px;padding:26px 20px 22px;box-shadow:0 18px 40px rgba(22,41,74,.22);color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.hero img{height:66px;width:auto;margin-bottom:6px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.wordmark{font-size:14.5px;font-weight:700;color:#dfe8f3}
.wordmark b{color:#f3dca6}
.plan{font-size:30px;font-weight:900;color:#f3dca6;letter-spacing:-.4px;line-height:1.3}
.who{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;color:#c3d2e4;border:1px solid rgba(243,220,166,.35);border-radius:999px;padding:4px 14px;background:rgba(255,255,255,.04)}
.who i{width:7px;height:7px;border-radius:50%;background:#5fe0a0;box-shadow:0 0 0 4px rgba(95,224,160,.18)}
.tgl,.lock{position:absolute;top:14px;width:38px;height:38px;border-radius:12px;color:#f3dca6;border:1px solid rgba(243,220,166,.35);display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.05);text-align:center}
.tgl{left:14px}.lock{right:14px}
.tgl:hover,.lock:hover{background:rgba(243,220,166,.14)}

/* ===== التنقل ===== */
.nav-shell{position:sticky;top:0;z-index:30;padding:14px 0 8px;background:linear-gradient(180deg,var(--bg-0) 70%,transparent)}
.nav{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:var(--shadow);max-width:620px;margin:0 auto}
.nav button{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:13px;font-size:15px;font-weight:800;color:var(--txt-3);transition:.2s;white-space:nowrap}
.nav button[data-go]{flex:1}
.nav button:hover{color:var(--txt)}
.nav button[aria-current="page"]{color:var(--sel-fg);background:var(--sel-bg);box-shadow:0 10px 22px rgba(22,41,74,.22)}
.nav .add{color:#16294a;background:linear-gradient(135deg,#f3dca6,#e3c485);box-shadow:0 8px 18px rgba(201,168,106,.35);font-weight:900}
.nav .add i{font-style:normal;width:24px;height:24px;border-radius:8px;background:#16294a;color:#f3dca6;display:grid;place-items:center;font-size:17px;line-height:1;text-align:center}
.nav .add:hover{color:#16294a;transform:translateY(-1px)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--txt-3);margin:2px 0 4px;min-height:22px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.off{background:var(--amber)}.dot.err{background:var(--rose)}
.lnk{color:var(--gold-2);font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* ===== عناصر عامة ===== */
.sec-head{display:flex;align-items:center;gap:12px;margin:16px 0 14px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:900;letter-spacing:-.3px}
.sec-head small{color:var(--txt-3);font-size:13.5px}
.sec-head .line{flex:1;min-width:40px;height:1px;background:linear-gradient(270deg,var(--line),transparent)}
.card{background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:15px;background:linear-gradient(135deg,#e6cf9a,#c9a86a);color:#16294a;flex:none;text-align:center}
.ch .cnt{margin-inline-start:auto;font-size:12.5px;font-weight:800;color:var(--gold-2);background:var(--tint-gold);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:13px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--tint);transition:.2s;text-align:center}
.btn:hover{background:var(--tint-gold)}
.btn.gold{background:linear-gradient(135deg,#f3dca6,#e3c485);color:#16294a;border-color:transparent;box-shadow:0 10px 22px rgba(201,168,106,.3)}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,transparent)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.55;pointer-events:none}
.empty{color:var(--txt-3);text-align:center;padding:24px 10px;font-size:14px;border:1px dashed var(--line-soft);border-radius:16px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:1px 10px;border:1px solid;white-space:nowrap;vertical-align:middle}
.b-todo{color:var(--muted);border-color:color-mix(in srgb,var(--muted) 40%,transparent)}
.b-doing{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.b-done{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 8%,transparent)}
.b-stuck,.b-late{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 45%,transparent);background:color-mix(in srgb,var(--rose) 8%,transparent)}
.b-cancel{color:var(--txt-3);border-color:var(--line-soft);text-decoration:line-through}
.b-urgent{color:#fff;background:#a32232;border-color:#a32232}
.b-high{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.b-q4{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent)}

/* ألوان أنواع المواعيد */
.t-اجتماع{--tc:var(--violet)}.t-مهمة{--tc:var(--gold)}.t-موعد{--tc:var(--cyan)}.t-زيارة{--tc:var(--green)}
.t-سفر{--tc:var(--amber)}.t-مناسبة{--tc:var(--pink)}.t-متابعة{--tc:var(--rose)}.t-q4{--tc:var(--cyan)}

/* ===================== القوائم المنسدلة المخصصة ===================== */
.dd{position:relative;min-width:0}
.ddb{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line-soft);border-radius:14px;background:var(--panel);font-size:14.5px;font-weight:700;color:var(--txt);transition:border-color .2s,box-shadow .2s,background .2s;text-align:start}
.ddb::after{content:"";flex:none;margin-inline-start:auto;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);opacity:.55;transition:transform .2s}
.ddb:hover{border-color:var(--line)}
.dd.open .ddb{border-color:#c9a86a;box-shadow:0 0 0 3px var(--tint-gold)}
.dd.open .ddb::after{transform:rotate(-135deg) translate(-2px,-2px)}
.ddb:disabled{opacity:.5}
.ddl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddl small{font-weight:600;color:var(--txt-3);font-size:12.5px;margin-inline-start:6px}
.ph{color:var(--txt-3);font-weight:500}
.oi{font-style:normal;flex:none;width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;font-size:15px;background:var(--tint-gold);border:1px solid var(--line);color:var(--gold-2);text-align:center;line-height:1}
.oi.ph{color:var(--gold-2)}
.oi.dot{font-size:11px;background:transparent;border-color:var(--line-soft)}
.c-todo{color:var(--cyan)!important}.c-doing{color:var(--amber)!important}.c-done{color:var(--green)!important}.c-stuck{color:var(--rose)!important}.c-cancel{color:var(--txt-3)!important}
.c-norm{color:var(--muted)!important}.c-high{color:var(--amber)!important}.c-urg{color:var(--rose)!important}

.ddm{position:absolute;inset-inline:0;top:calc(100% + 8px);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--pop);padding:8px;max-height:340px;overflow:auto;overscroll-behavior:contain;animation:ddin .16s ease;transform-origin:top}
.ddm.up{top:auto;bottom:calc(100% + 8px);transform-origin:bottom}
@keyframes ddin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.ddh{display:none}
.ddset{display:flex;flex-direction:column;gap:2px}
.ddg{font-size:11.5px;font-weight:900;color:var(--gold-2);letter-spacing:.2px;padding:8px 8px 4px;display:flex;align-items:center;gap:8px}
.ddg::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.ddo{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;font-size:14px;font-weight:700;color:var(--txt);border:1px solid transparent;transition:background .12s,border-color .12s;text-align:start}
.ddo:hover,.ddo:focus-visible{background:var(--tint-gold);outline:none}
.ddo[aria-selected="true"]{background:var(--sel-bg);color:var(--sel-fg)}
.ddo[aria-selected="true"] .oi{background:rgba(243,220,166,.18);border-color:rgba(243,220,166,.4);color:inherit}
.ddo[aria-selected="true"] small{color:inherit;opacity:.8}
.ddo:disabled{opacity:.35}
.ddo .ot{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.ddo .ot small{font-size:11.5px;color:var(--txt-3);font-weight:600}
.ddo:not(.cbo)[aria-selected="true"]::after{content:"✓";font-weight:900;margin-inline-start:auto}
.cb{flex:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:900;color:transparent;transition:.15s}
.ddo.cbo[aria-selected="true"]{background:var(--tint-gold);color:var(--txt)}
.ddo.cbo[aria-selected="true"] .cb{background:#c9a86a;border-color:#c9a86a;color:#16294a}
.dds{position:sticky;top:-8px;z-index:1;background:var(--panel);padding:2px 0 8px;margin-top:-2px}
.dds input{width:100%;border:1px solid var(--line-soft);background:var(--tint);border-radius:11px;padding:8px 12px;font-size:14px}
.dds input:focus{outline:none;border-color:#c9a86a}
.ddf{position:sticky;bottom:-8px;background:var(--panel);display:flex;gap:8px;justify-content:flex-end;padding:8px 2px 2px;margin-top:6px;border-top:1px solid var(--line-soft)}
.ddnone{padding:14px;text-align:center;color:var(--txt-3);font-size:13px}

/* تصنيف بنمط الربع الرابع: شبكة عمودين بأيقونات */
.dd.cat .ddm{max-height:430px}
.dd.cat .ddset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.dd.cat .ddo{white-space:normal;line-height:1.35;padding:8px 10px}
.dd.cat .ddo:hover{border-color:var(--line)}
.dd.cat .ddo[aria-selected="true"]{background:var(--tint-gold);color:var(--txt);border-color:#c9a86a}
.dd.cat .ddo[aria-selected="true"] .oi{background:#c9a86a;border-color:#c9a86a}
.dd.cat .ddo[aria-selected="true"]::after{content:none}
/* الوقت: شبكة أزرار */
.dd.time .ddset{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.dd.time .ddo{justify-content:center;text-align:center;padding:8px 4px;font-size:14px;border:1px solid var(--line-soft)}
.dd.time .ddo .ot{align-items:center}
.dd.time .ddo::after{content:none!important}
.dd.time .ddo.wide{grid-column:1/-1;font-weight:800}
.dd.time .ddm{min-width:300px}
/* الحالة والأولوية */
.dd.st .ddo,.dd.pr .ddo{padding:9px 10px}
/* فلاتر على شكل كبسولات */
.dd.pill{flex:none}
.dd.pill .ddb{min-height:0;width:auto;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:800;background:var(--panel);border-color:transparent;color:var(--txt-2);gap:8px}
.dd.pill .ddb:hover{border-color:var(--line)}
.dd.pill.on .ddb{background:var(--sel-bg);color:var(--sel-fg)}
.dd.pill .ddm{inset-inline:auto;inset-inline-start:0;width:max-content;min-width:230px;max-width:min(340px,86vw)}
/* المنتقي المتعدد */
.dd.multi .ddb{flex-wrap:wrap;align-items:center;min-height:48px}
.pill-o{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;background:var(--tint-gold);border:1px solid var(--line);border-radius:999px;padding:2px 10px;line-height:1.6}
.dd.multi .ddm{max-height:380px}
/* منتقي التاريخ */
.dd.date .ddl{display:flex;flex-direction:column;line-height:1.3;white-space:normal}
.dd.date .ddl small{margin:0;font-size:11.5px;color:var(--gold-2)}
.dp{min-width:300px}
.dd.date .ddm{inset-inline:auto;inset-inline-start:0;width:340px;max-width:90vw}
.dph{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dph b{flex:1;text-align:center;font-size:15.5px;font-weight:900;line-height:1.3}
.dph b small{display:block;font-size:11.5px;color:var(--gold-2);font-weight:700}
.dpa{width:34px;height:34px;border-radius:11px;border:1px solid var(--line-soft);display:grid;place-items:center;font-size:17px;text-align:center}
.dpa:hover{background:var(--tint-gold)}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dpw{text-align:center;font-size:11.5px;font-weight:800;color:var(--txt-3);padding:4px 0}
.dpd{height:38px;border-radius:11px;font-size:14px;font-weight:800;text-align:center;border:1px solid transparent;position:relative}
.dpd:hover{background:var(--tint-gold)}
.dpd.out{color:var(--txt-3);opacity:.5;font-weight:600}
.dpd.today{border-color:#c9a86a}
.dpd.sel{background:var(--sel-bg);color:var(--sel-fg)}
.dpd.inr{background:var(--tint-gold)}
.dpd:disabled{opacity:.25;background:none}
.dpq{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.dpq button{padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:800;background:var(--tint);border:1px solid var(--line-soft)}
.dpq button:hover{border-color:var(--line);background:var(--tint-gold)}

/* ===== مهام اليوم ===== */
.today-hero{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.bigday{width:118px;height:118px;border-radius:26px;background:#16294a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #c9a86a;box-shadow:0 14px 30px rgba(22,41,74,.3)}
.bigday b{font-size:46px;line-height:1;font-weight:900;color:#f3dca6}
.bigday span{font-size:14px;font-weight:700;margin-top:6px}
.tdate h2{font-size:26px;font-weight:900}
.tdate p{color:var(--txt-2);font-size:14.5px}
.tdate .hij{color:var(--gold-2);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{border:1px solid var(--line-soft);border-radius:16px;padding:12px 14px;background:var(--tint);text-align:start}
.stat b{display:block;font-size:28px;font-weight:900;line-height:1.2}
.stat span{font-size:12.5px;color:var(--txt-3);font-weight:700}
.stat.late b{color:var(--rose)}.stat.wk b{color:var(--gold-2)}.stat.dn b{color:var(--green)}
button.stat:hover{border-color:var(--line)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.tl{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:stretch;text-align:start;width:100%;border:1px solid var(--line-soft);border-radius:16px;padding:12px;background:var(--panel);transition:.18s;position:relative}
.ev:hover{border-color:var(--line);transform:translateY(-1px);box-shadow:0 10px 22px rgba(22,41,74,.08)}
.ev .tm{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:color-mix(in srgb,var(--tc) 12%,transparent);color:var(--tc);font-weight:900;font-size:15px;line-height:1.25;text-align:center;padding:4px}
.ev .tm small{font-size:11px;font-weight:700;opacity:.85}
.ev .bd{min-width:0}
.ev .tt{font-weight:800;font-size:15.5px;line-height:1.45}
.ev .mt{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--txt-3);font-size:12.5px;margin-top:4px;align-items:center}
.ev .mt .tp{color:var(--tc);font-weight:800}
.ev.done .tt{text-decoration:line-through;opacity:.6}
.ev.cancel{opacity:.55}
.ev::before{content:"";position:absolute;inset-block:12px;inset-inline-start:-1px;width:3px;border-radius:3px;background:var(--tc)}
.grp{font-size:13px;font-weight:800;color:var(--gold-2);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.grp:first-child{margin-top:0}

/* ===== التقويم ===== */
.calbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seg2{display:inline-flex;background:var(--tint);border:1px solid var(--line-soft);border-radius:14px;padding:4px;gap:2px}
.seg2 button{padding:7px 16px;border-radius:10px;font-size:13.5px;font-weight:800;color:var(--txt-3)}
.seg2 button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);box-shadow:0 6px 14px rgba(22,41,74,.18)}
.pager{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.pager h3{font-size:21px;font-weight:900;min-width:190px;text-align:center;line-height:1.3}
.pager h3 small{display:block;font-size:12px;color:var(--gold-2);font-weight:700}
.arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;background:var(--panel);text-align:center}
.arrow:hover{background:var(--tint-gold)}

.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;margin-bottom:14px;background:var(--tint);border:1px solid var(--line-soft);border-radius:16px}
.srch{position:relative;flex:1 1 220px;min-width:180px;display:flex;align-items:center}
.srch .si{position:absolute;inset-inline-start:12px;color:var(--txt-3);font-size:16px;pointer-events:none}
.srch input{width:100%;border:1px solid transparent;background:var(--panel);border-radius:999px;padding:8px 38px;font-size:14px;font-weight:600;min-height:38px}
.srch input::-webkit-search-cancel-button{display:none}
.srch input:focus{outline:none;border-color:#c9a86a;box-shadow:0 0 0 3px var(--tint-gold)}
.srch .sx{position:absolute;inset-inline-end:8px;width:24px;height:24px;border-radius:50%;background:var(--tint);font-size:12px;color:var(--txt-3);text-align:center}
.fpill{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:800;background:var(--panel);color:var(--txt-2);border:1px solid transparent}
.fpill:hover{border-color:var(--line)}
.fpill[aria-pressed="true"]{color:var(--cyan)}
.fpill .sw{width:26px;height:15px;border-radius:999px;background:var(--line-soft);position:relative;transition:.2s}
.fpill .sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.fpill[aria-pressed="true"] .sw{background:var(--cyan)}
.fpill[aria-pressed="true"] .sw::after{inset-inline-start:13px}
.fclear{flex:none;font-size:13px;font-weight:800;color:var(--rose);padding:6px 8px}
.fres{margin:-4px 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.fres header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--tint-gold);font-size:13.5px;font-weight:800}
.fres header span:last-child{margin-inline-start:auto;color:var(--txt-3);font-weight:700;font-size:12px}
.frow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 14px;border-top:1px solid var(--line-soft);text-align:start}
.frow:hover{background:var(--tint)}
.frow .d{font-size:13px;font-weight:800}
.frow .d small{display:block;color:var(--txt-3);font-weight:600;font-size:12px}
.frow b{font-size:14.5px;font-weight:800;display:block}
.frow .x span{font-size:12px;color:var(--txt-3)}
mark{background:color-mix(in srgb,#c9a86a 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.fcount{font-size:12.5px;color:var(--txt-3);font-weight:700;margin:-6px 0 10px;display:flex;gap:6px;align-items:center}

.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wdh{text-align:center;font-size:13px;font-weight:800;color:var(--txt-3);padding:4px 0}
.wdh.fri{color:var(--gold-2)}
.cell{min-height:118px;border:1px solid var(--line-soft);border-radius:14px;padding:7px;background:var(--panel);text-align:start;display:flex;flex-direction:column;gap:4px;transition:.15s;min-width:0}
.cell:hover{border-color:var(--line)}
.cell.out{opacity:.4}
.cell.today{border:2px solid #c9a86a;box-shadow:0 0 0 4px var(--tint-gold)}
.cell .dn{font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.cell.today .dn b{background:#16294a;color:#f3dca6;border-radius:8px;padding:0 7px}
.cell .dn small{font-size:10.5px;color:var(--txt-3);font-weight:700}
.chip{display:block;font-size:12px;font-weight:700;line-height:1.35;border-radius:7px;padding:3px 6px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--txt);border-inline-start:3px solid var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.55;text-decoration:line-through}
.more{font-size:11.5px;font-weight:800;color:var(--gold-2)}

.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wday{border:1px solid var(--line-soft);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;min-height:300px;overflow:hidden}
.wday header{padding:10px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:8px;background:var(--tint)}
.wday header b{font-size:22px;font-weight:900}
.wday header span{font-weight:800;font-size:13.5px}
.wday header em{margin-inline-start:auto;font-style:normal;font-size:11.5px;font-weight:800;color:var(--txt-3)}
.wday.today header{background:#16294a;color:#fff}
.wday.today header b,.wday.today header em{color:#f3dca6}
.wday .rows{padding:8px;display:flex;flex-direction:column;gap:7px;flex:1}
.wrow{text-align:start;border-radius:11px;padding:7px 9px;background:color-mix(in srgb,var(--tc) 10%,transparent);border-inline-start:3px solid var(--tc);width:100%}
.wrow:hover{background:color-mix(in srgb,var(--tc) 18%,transparent)}
.wrow .t{font-size:12px;font-weight:800;color:var(--tc)}
.wrow .n{font-size:13.5px;font-weight:800;line-height:1.4}
.wrow .o{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.wrow.done .n{text-decoration:line-through;opacity:.6}
.wadd{margin:auto 8px 8px;font-size:12.5px;font-weight:800;color:var(--txt-3);border:1px dashed var(--line-soft);border-radius:10px;padding:6px;text-align:center}
.wadd:hover{color:var(--gold-2);border-color:var(--line)}

/* ===== النافذة والنموذج ===== */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,16,30,.62);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px 120px;overflow:auto}
.modal{width:100%;max-width:740px;position:relative}
.x-close{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:11px;border:1px solid var(--line-soft);font-size:18px;text-align:center}
.x-close:hover{background:var(--tint)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-inline-end:40px}
.mh h3{font-size:20px;font-weight:900}
form{display:grid;gap:14px}
.lab{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:800;color:var(--txt-2);min-width:0}
.lab>span:first-child{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.sub{font-weight:500;color:var(--txt-3);font-size:12px}
.req{color:var(--rose)}
.inp{border:1px solid var(--line-soft);background:var(--panel);border-radius:14px;padding:11px 14px;font-size:14.5px;font-weight:600;color:var(--txt);width:100%;min-width:0;min-height:48px}
.inp::placeholder{color:var(--txt-3);font-weight:500}
.inp:focus{border-color:#c9a86a;outline:none;box-shadow:0 0 0 3px var(--tint-gold)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
.fs{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--tint-gold);display:grid;gap:12px}
.fs .lg{font-size:13px;font-weight:900;color:var(--gold-2);display:flex;align-items:center;gap:8px}
.fs .lg i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#16294a;color:#f3dca6;font-size:10px}
.dur{font-size:12px;font-weight:800;color:var(--gold-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 13px;border-radius:12px;border:1px solid var(--line-soft);font-size:13.5px;font-weight:800;color:var(--txt-2);background:var(--panel)}
.seg button:hover{border-color:var(--line)}
.seg button.t[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 16%,var(--panel));color:var(--txt);border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.seg button.q[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg);border-color:transparent}
.q4box{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--cyan) 35%,transparent);background:color-mix(in srgb,var(--cyan) 6%,var(--panel))}
.q4t{flex:1 1 240px;display:flex;flex-direction:column;gap:2px}
.q4t b{font-size:14px;font-weight:900}
.q4t small{font-size:12px;color:var(--txt-3);font-weight:600;line-height:1.6}
.q4seg{flex:none}
.q4seg button{white-space:nowrap}
.q4seg button[data-v="1"][aria-pressed="true"]{background:var(--cyan);color:#fff}
.b-pub{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 45%,transparent);background:color-mix(in srgb,var(--cyan) 7%,transparent)}
.notify{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--line-soft);font-size:14px;font-weight:700;cursor:pointer;position:relative}
.notify input{position:absolute;opacity:0;pointer-events:none}
.notify .sw{flex:none;width:42px;height:24px;border-radius:999px;background:var(--line-soft);position:relative;transition:.2s}
.notify .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:.2s}
.notify input:checked+.sw{background:#c9a86a}
.notify input:checked+.sw::after{inset-inline-start:21px}
.notify input:focus-visible+.sw{outline:2px solid var(--gold);outline-offset:2px}
.notify small{display:block;font-weight:500;color:var(--txt-3);font-size:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.msg{font-size:13.5px;font-weight:700;min-height:20px}
.msg.err{color:var(--rose)}.msg.ok{color:var(--green)}
.dl{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:6px 0 18px;font-size:14.5px}
.dl dt{color:var(--txt-3);font-weight:800}
.dl dd{font-weight:600;min-width:0;white-space:pre-wrap;word-break:break-word}
.dbadges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

/* ===== شاشة الدخول ===== */
.gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:radial-gradient(70% 60% at 50% 0%,#24406b,#0f1f38)}
.gate .card{max-width:400px;width:100%;text-align:center;background:#16294a;border:1px solid rgba(243,220,166,.35);color:#fff}
.gate img{height:64px;margin:4px auto 12px;display:block}
.gate h2{font-size:22px;font-weight:900;color:#f3dca6}
.gate p{font-size:14px;color:#c3d2e4;margin:6px 0 18px}
.gate .inp{text-align:center;font-size:18px;letter-spacing:4px;background:rgba(255,255,255,.06);border-color:rgba(243,220,166,.35);color:#fff}
.gate .rem{display:inline-flex;align-items:center;gap:8px;color:#c3d2e4;font-size:13.5px;margin:12px auto;cursor:pointer}
.gate .rem input{accent-color:#c9a86a;width:16px;height:16px}
.gate .msg{color:#ff9aa4}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:95;background:#16294a;color:#fff;border:1px solid #c9a86a;border-radius:14px;padding:11px 18px;font-weight:700;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.foot{text-align:center;color:var(--txt-3);font-size:12.5px;margin-top:36px;line-height:2}
.foot b{color:var(--gold-2)}

@media (max-width:980px){
  .cols{grid-template-columns:1fr}
  .wgrid{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 12px 100px}
  .plan{font-size:23px}.hero img{height:52px}
  .nav{gap:4px;padding:5px;border-radius:15px}
  .nav button[data-go]{padding:10px 4px;font-size:13.5px;gap:5px}
  .nav button[data-go] span{display:none}
  .nav .add{flex:1.15;padding:10px 6px;font-size:14px;gap:6px}
  .nav .add i{width:22px;height:22px;font-size:16px}
  .today-hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:12px}
  .bigday{width:96px;height:96px}.bigday b{font-size:38px}
  .tdate h2{font-size:21px}
  .card{padding:14px}
  .calbar{gap:8px}
  .pager{order:-1;flex-basis:100%}
  .pager h3{font-size:18px;min-width:0;flex:1}
  .fbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-14px;border-radius:0;border-inline:0;padding:8px 14px}
  .fbar::-webkit-scrollbar{display:none}
  .srch{flex:0 0 190px;min-width:0}
  .frow{grid-template-columns:1fr;gap:4px}
  .mgrid{gap:3px}
  .cell{min-height:64px;padding:4px;border-radius:10px}
  .cell .dn{font-size:13px}.cell .dn small{display:none}
  .chip{font-size:0;padding:0;height:6px;border-radius:3px;border:0;background:var(--tc)}
  .more{font-size:10px}
  .wdh{font-size:11px}
  .wgrid{grid-template-columns:1fr}
  .wday{min-height:0}
  .g2,.g3{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dd{margin-bottom:8px}
  .ev{grid-template-columns:64px 1fr}
  /* القوائم المنسدلة تصبح ورقة سفلية على الجوال */
  .ddm,.ddm.up,.dd.pill .ddm{position:fixed;inset:auto 0 0 0;top:auto;bottom:0;width:auto;min-width:0;max-width:none;max-height:72vh;border-radius:22px 22px 0 0;padding:10px 12px calc(16px + env(safe-area-inset-bottom));box-shadow:0 0 0 100vmax rgba(8,16,30,.55),0 -10px 30px rgba(0,0,0,.25);animation:sheet .2s ease;z-index:90}
  @keyframes sheet{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
  .ddh{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;padding:6px 0 10px;position:relative}
  .ddh::before{content:"";position:absolute;top:-4px;width:40px;height:4px;border-radius:4px;background:var(--line-soft)}
  .dd.time .ddm{min-width:0}
  .dd.cat .ddset{grid-template-columns:1fr}
  .dp{min-width:0}
  .dpd{height:44px}
  .ddo{padding:11px 10px}
}
@media print{.nav-shell,.tgl,.lock,.sync,.fbar{display:none!important}}
</style>
</head>

function pad(n){return (n<10?"0":"")+n}
function ds(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){var p=String(s||"").split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function todayS(){return ds(new Date())}
function wkStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addD(x,-((x.getDay()+1)%7))}
function wname(s){return WD[pd(s).getDay()]}
function dLabel(s){var d=pd(s);return d.getDate()+" "+MN[d.getMonth()]}
function dLong(s){var d=pd(s);return WD[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear()}
var HIJ=null,HIJM=null;try{HIJ=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"});HIJM=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{month:"long",year:"numeric"})}catch(e){}
function hijri(s){try{return HIJ?HIJ.format(pd(s)).replace(/\s*هـ$/,"")+" هـ":""}catch(e){return ""}}
function hijriMonths(a,b){try{if(!HIJM)return "";var x=HIJM.format(a).replace(/\s*هـ$/,""),y=HIJM.format(b).replace(/\s*هـ$/,"");return (x===y?x:x.replace(/ \d+$/,"")+" – "+y)+" هـ"}catch(e){return ""}}
function t12(t){if(!t)return "";var p=t.split(":"),h=+p[0],m=p[1];var ap=h<12?"ص":"م";h=h%12||12;return h+":"+m+" "+ap}
function timeRange(it){if(!it.st)return "طوال اليوم";return t12(it.st)+(it.et&&it.et!==it.st?" – "+t12(it.et):"")}
function dayTime(it,s){if(!s||!it.ed||it.ed===it.sd||s===it.sd)return timeRange(it);if(s<it.ed)return "مستمر";return "ينتهي"+(it.et?" "+t12(it.et):" اليوم")}
function mins(t){var p=t.split(":");return +p[0]*60+ +p[1]}
function durTxt(m){if(m<60)return m+" دقيقة";var h=Math.floor(m/60),r=m%60;var hs=h===1?"ساعة":h===2?"ساعتان":h+" ساعات";return r?hs+" و"+r+" د":hs}
function endStamp(it){return (it.ed||it.sd)+" "+(it.et||it.st||"23:59")}
function nowStamp(){var d=new Date();return ds(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function isClosed(it){return it.status==="تم الإنجاز"||it.status==="ملغاة"}
function isLate(it){return !isClosed(it)&&endStamp(it)<nowStamp()}
function onDay(it,s){return it.sd<=s&&(it.ed||it.sd)>=s}
function sortKey(it){return it.sd+" "+(it.st||"00:00")}

function all(){var a=items.slice();if(showQ4)a=a.concat(linked);return a.sort(function(a,b){return sortKey(a)<sortKey(b)?-1:sortKey(a)>sortKey(b)?1:0})}
function passF(it){
  if(F.type&&(it.src==="q4"||it.type!==F.type))return false;
  if(F.owner&&it.owners.indexOf(F.owner)<0)return false;
  if(F.status==="open"&&isClosed(it))return false;
  if(F.status==="late"&&!isLate(it))return false;
  if(F.status&&F.status!=="open"&&F.status!=="late"&&it.status!==F.status)return false;
  if(F.q){var hay=(it.title+" "+(it.notes||"")+" "+(it.place||"")+" "+ownersTxt(it)+" "+(it.cat||"")).toLowerCase();if(hay.indexOf(F.q.toLowerCase())<0)return false}
  return true;
}
function calAll(){return all().filter(passF)}
function dayItems(s,src){return (src||all()).filter(function(it){return onDay(it,s)})}
function tcls(it){return it.src==="q4"?"t-q4":"t-"+(TYPES.indexOf(it.type)>=0?it.type:"مهمة")}
function ownersTxt(it){return (it.owners||[]).join("، ")}
function rank(n){return /^د\./.test(n)?0:/^م\./.test(n)?1:/^أ\./.test(n)?2:3}
function sortNames(a){return a.sort(function(x,y){return rank(x)-rank(y)||x.localeCompare(y,"ar")})}
function nameGroup(n){return ["الدكاترة","المهندسون","الأساتذة","آخرون"][rank(n)]}
function plural(n,one,two,many){return n===1?one:n===2?two:n<=10?many:one}

var openDD=null;
function DD(host,cfg){
  host=typeof host==="string"?$(host):host;
  var st={cfg:cfg,value:cfg.multi?(cfg.value||[]).slice():(cfg.value==null?"":String(cfg.value))};
  var el=document.createElement("div");el.className="dd "+(cfg.cls||"");
  el.innerHTML='<button type="button" class="ddb" aria-haspopup="listbox" aria-expanded="false"'+(cfg.aria?' aria-label="'+esc(cfg.aria)+'"':"")+'></button><div class="ddm" role="listbox" hidden></div>';
  host.innerHTML="";host.appendChild(el);
  st.el=el;st.btn=el.firstChild;st.menu=el.lastChild;
  st.btn.addEventListener("click",function(e){e.stopPropagation();if(openDD===st)closeDD();else showDD(st)});
  st.menu.addEventListener("click",function(e){e.stopPropagation()});
  st.set=function(v,silent){st.value=v;paintDD(st);if(!silent&&cfg.onChange)cfg.onChange(v)};
  st.refresh=function(){paintDD(st);if(openDD===st)buildDD(st)};
  st.disable=function(b){st.btn.disabled=!!b};
  paintDD(st);return st;
}
function ddItems(st){var c=st.cfg.items;return typeof c==="function"?c():(c||[])}
function ddFind(st,v){return ddItems(st).filter(function(i){return String(i.v)===String(v)})[0]}
function oiHtml(i){return i.ic?'<i class="oi'+(i.icCls?" "+i.icCls:"")+'">'+i.ic+'</i>':""}
function paintDD(st){
  var c=st.cfg,h;
  if(c.paint)h=c.paint(st.value,st);
  else if(c.multi)h=st.value.length?st.value.map(function(v){return '<span class="pill-o">'+esc(v)+'</span>'}).join(""):(c.ic?'<i class="oi ph">'+c.ic+'</i>':"")+'<span class="ddl ph">'+esc(c.ph||"اختر")+'</span>';
  else{var it=ddFind(st,st.value);h=it&&(it.v!==""||!c.ph)?oiHtml(it)+'<span class="ddl">'+esc(it.bl||it.l)+(it.bsub?'<small>'+esc(it.bsub)+'</small>':"")+'</span>':(c.ic?'<i class="oi ph">'+c.ic+'</i>':"")+'<span class="ddl ph">'+esc(c.ph||"اختر")+'</span>'}
  st.btn.innerHTML=h;
  if(c.pillOn)st.el.classList.toggle("on",c.pillOn(st.value));
}
function buildDD(st){
  var c=st.cfg,m=st.menu,h='<div class="ddh">'+esc(c.title||c.ph||"")+'</div>';
  if(c.build){m.innerHTML=h+'<div class="ddc"></div>';c.build(m.lastChild,st);return}
  if(c.search)h+='<div class="dds"><input type="search" placeholder="بحث…" aria-label="بحث في القائمة" autocomplete="off"></div>';
  var its=ddItems(st),groups=[],gi={};
  its.forEach(function(i){var g=i.g||"";if(!(g in gi)){gi[g]=groups.length;groups.push({g:g,a:[]})}groups[gi[g]].a.push(i)});
  groups.forEach(function(G){
    h+='<div class="ddgw">'+(G.g?'<div class="ddg">'+esc(G.g)+'</div>':"")+'<div class="ddset">';
    G.a.forEach(function(i){
      var sel=c.multi?st.value.indexOf(i.v)>=0:String(st.value)===String(i.v);
      h+='<button type="button" class="ddo'+(c.multi?" cbo":"")+(i.cls?" "+i.cls:"")+'" role="option" data-v="'+esc(i.v)+'" aria-selected="'+sel+'"'+(i.dis?" disabled":"")+'>'+(c.multi?'<i class="cb">✓</i>':"")+oiHtml(i)+'<span class="ot">'+esc(i.l)+(i.sub?'<small>'+esc(i.sub)+'</small>':"")+'</span></button>';
    });
    h+='</div></div>';
  });
  if(!its.length)h+='<div class="ddnone">لا توجد خيارات بعد.</div>';
  if(c.multi)h+='<div class="ddf"><button type="button" class="btn sm" data-clear>مسح الكل</button><button type="button" class="btn gold sm" data-done>تم</button></div>';
  m.innerHTML=h;
  m.querySelectorAll(".ddo").forEach(function(b){b.onclick=function(){
    var v=b.getAttribute("data-v");
    if(c.multi){var a=st.value.slice(),k=a.indexOf(v);if(k<0)a.push(v);else a.splice(k,1);st.value=a;b.setAttribute("aria-selected",k<0);paintDD(st);if(c.onChange)c.onChange(a)}
    else{st.set(v);closeDD();st.btn.focus()}
  }});
  var si=m.querySelector(".dds input");
  if(si)si.oninput=function(){var q=si.value.trim();m.querySelectorAll(".ddgw").forEach(function(g){var any=false;g.querySelectorAll(".ddo").forEach(function(o){var hit=!q||o.textContent.indexOf(q)>=0;o.hidden=!hit;if(hit)any=true});g.hidden=!any})};
  var dn=m.querySelector("[data-done]");if(dn)dn.onclick=function(){closeDD()};
  var cl=m.querySelector("[data-clear]");if(cl)cl.onclick=function(){st.set([]);buildDD(st)};
}
function showDD(st){
  closeDD();openDD=st;buildDD(st);
  st.menu.hidden=false;st.el.classList.add("open");st.btn.setAttribute("aria-expanded","true");
  st.menu.classList.remove("up");
  if(!isMobile()){
    var r=st.btn.getBoundingClientRect(),below=innerHeight-r.bottom,need=Math.min(st.menu.scrollHeight,/cat/.test(st.cfg.cls||"")?430:340)+16;
    if(below<need&&r.top>below)st.menu.classList.add("up");
  }
  var s=st.menu.querySelector('.ddo[aria-selected="true"]');if(s)s.scrollIntoView({block:"nearest"});
  var si=st.menu.querySelector(".dds input");if(si&&!isMobile())si.focus();
}
function closeDD(){if(!openDD)return;var st=openDD;openDD=null;st.menu.hidden=true;st.el.classList.remove("open");st.btn.setAttribute("aria-expanded","false")}
document.addEventListener("click",function(){closeDD()});
document.addEventListener("keydown",function(e){
  if(!openDD)return;
  if(e.key==="Escape"){e.stopPropagation();var b=openDD.btn;closeDD();b.focus();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    var os=[].slice.call(openDD.menu.querySelectorAll(".ddo:not(:disabled),.dpd:not(:disabled)")).filter(function(o){return o.offsetParent});if(!os.length)return;
    e.preventDefault();var i=os.indexOf(document.activeElement);i=e.key==="ArrowDown"?Math.min(os.length-1,i+1):Math.max(0,i-1);os[i].focus();
  }
},true);

/* ---------- منتقي التاريخ ---------- */
function DP(host,cfg){
  function build(box,st){
    if(!st.view){var b=st.value?pd(st.value):(cfg.min&&cfg.min()?pd(cfg.min()):new Date());st.view=new Date(b.getFullYear(),b.getMonth(),1)}
    var v=st.view,y=v.getFullYear(),mo=v.getMonth(),t=todayS(),mn=cfg.min?cfg.min():"",rs=cfg.rangeStart?cfg.rangeStart():"";
    var start=wkStart(v),h='<div class="dp"><div class="dph"><button type="button" class="dpa" data-m="-1" aria-label="الشهر السابق">›</button><b>'+MN[mo]+' <span class="num">'+y+'</span><small>'+esc(hijriMonths(v,new Date(y,mo+1,0)))+'</small></b><button type="button" class="dpa" data-m="1" aria-label="الشهر التالي">‹</button></div><div class="dpg">';
    WD_SHORT.forEach(function(w){h+='<span class="dpw">'+w+'</span>'});
    for(var i=0;i<42;i++){var d=addD(start,i),s=ds(d);
      var cls="dpd num"+(d.getMonth()!==mo?" out":"")+(s===t?" today":"")+(s===st.value?" sel":"")+(rs&&st.value&&s>rs&&s<st.value?" inr":"");
      h+='<button type="button" class="'+cls+'" data-d="'+s+'"'+(mn&&s<mn?" disabled":"")+' aria-label="'+esc(dLong(s))+'">'+d.getDate()+'</button>'}
    h+='</div><div class="dpq">';
    (cfg.quick||[["اليوم",0],["غداً",1],["بعد أسبوع",7]]).forEach(function(x){h+='<button type="button" data-q="'+x[1]+'">'+x[0]+'</button>'});
    if(cfg.allowEmpty)h+='<button type="button" data-q="none">'+esc(cfg.emptyLabel||"بدون")+'</button>';
    h+='</div></div>';
    box.innerHTML=h;
    box.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){st.view=new Date(y,mo+ +b.getAttribute("data-m"),1);build(box,st)}});
    box.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){st.set(b.getAttribute("data-d"));closeDD()}});
    box.querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){
      var x=b.getAttribute("data-q");st.view=null;
      if(x==="none"){st.set("");closeDD();return}
      var base=(cfg.quickBase&&cfg.quickBase())||todayS(),s=ds(addD(pd(base),+x));if(mn&&s<mn)s=mn;st.set(s);closeDD();
    }});
  }
  var st=DD(host,{cls:"date",title:cfg.title,ph:cfg.ph,value:cfg.value,onChange:function(v){st.view=v?new Date(pd(v).getFullYear(),pd(v).getMonth(),1):null;if(cfg.onChange)cfg.onChange(v)},
    paint:function(v){return v?'<i class="oi">▦</i><span class="ddl"><span class="num">'+esc(dLong(v))+'</span><small>'+esc(hijri(v))+'</small></span>':'<i class="oi ph">▦</i><span class="ddl ph">'+esc(cfg.ph||"اختر التاريخ")+'</span>'},
    build:build});
  return st;
}
function timeItems(opt){
  opt=opt||{};var a=[];
  a.push(opt.end?{v:"",l:"بدون وقت نهاية",cls:"wide"}:{v:"",l:"طوال اليوم",cls:"wide"});
  for(var m=6*60;m<24*60;m+=15){
    var v=pad(Math.floor(m/60))+":"+pad(m%60),h=Math.floor(m/60);
    var it={v:v,l:t12(v).replace(/ [صم]$/,""),bl:t12(v),g:h<12?"صباحاً":h<16?"ظهراً وعصراً":"مساءً"};
    if(opt.end&&opt.start){var d=m-mins(opt.start);if(d<=0)it.dis=true}
    a.push(it);
  }
  return a;
}

/* ---------- الاتصال بالخادم ---------- */
function call(action,extra){
  if(DEMO)return demoCall(action,extra||{});
  var body={app:"ceo",action:action,code:code};for(var k in extra)body[k]=extra[k];
  return fetch(API_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.ok&&!d.ceo)throw new Error("الربط مع Apps Script لم يُفعّل بعد.");
      if(!d||!d.ok){var e=new Error((d&&d.error)||"تعذر الاتصال");e.code=d&&d.code;throw e}
      return d;
    });
}
function apply(d){
  if(d.items)items=d.items.map(norm);
  if(d.linked)linked=d.linked.map(function(x){x=norm(x);x.src="q4";return x});
  if(d.staff&&d.staff.length)staff=d.staff;
  if(d.cats&&d.cats.length)CATS=d.cats;
  lastSync=new Date();syncErr="";
  if(!DEMO)lsSet("ceocache",{items:items,linked:linked,staff:staff});
  render();
}
function norm(x){x.owners=Array.isArray(x.owners)?x.owners:String(x.owners||"").split(/[،,]\s*/).filter(Boolean);return x}
function pull(){
  if(busy)return Promise.resolve();
  return call("list").then(apply).catch(function(e){
    if(e.code==="bad_code"){lockOut("الرمز غير صحيح أو تغيّر.");return}
    syncErr=e.message||"تعذر الاتصال";renderSync();
  });
}
function renderSync(){
  var el=$("sync"),h;
  if(DEMO)h='<span class="dot off"></span><span>وضع المعاينة ببيانات تجريبية، لا تُرسل أي إيميلات.</span>';
  else if(syncErr)h='<span class="dot err"></span><span>'+esc(syncErr)+'</span> <button class="lnk" id="retry" type="button">إعادة المحاولة</button>';
  else if(lastSync)h='<span class="dot"></span><span>متصل · آخر تحديث <span class="num">'+pad(lastSync.getHours())+":"+pad(lastSync.getMinutes())+'</span></span>';
  else h='<span class="dot off"></span><span>جارٍ التحميل…</span>';
  el.innerHTML=h;
  if($("retry"))$("retry").onclick=function(){syncErr="";renderSync();pull()};
}

function evCard(it,opts){
  opts=opts||{};
  var cont=opts.day&&it.ed&&it.ed!==it.sd&&opts.day>it.sd;

function hl(s){s=esc(s);if(!F.q)return s;var q=esc(F.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return s.replace(new RegExp(q,"gi"),function(x){return "<mark>"+x+"</mark>"})}

function lockOut(m){
